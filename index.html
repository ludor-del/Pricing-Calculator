<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odoo Precision Quote Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-10 font-sans text-slate-800">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b pb-6 border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900">Odoo Precision Quote Tool</h1>
                <p class="text-slate-500 text-lg">Custom Negotiation Mode Active</p>
            </div>
            
            <div class="flex items-center space-x-3 bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-xs font-bold uppercase text-slate-400">USD</span>
                <div class="relative inline-block w-12 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="currency_toggle" onchange="calculate()" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer outline-none transition-all duration-300 right-6"/>
                    <label for="currency_toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer transition-colors duration-300"></label>
                </div>
                <span class="text-xs font-bold uppercase text-slate-400">CAD</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                
                <section class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                    <h2 class="text-xl font-bold mb-4 text-purple-700">1. Software & Contract</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Plan</label>
                            <select id="plan" class="w-full border p-3 rounded-xl bg-slate-50 font-semibold" onchange="calculate()">
                                <option value="standard">Standard Plan</option>
                                <option value="custom" selected>Custom Plan</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Users</label>
                            <input type="number" id="users" value="1" min="1" class="w-full border p-3 rounded-xl font-semibold outline-none focus:ring-2 focus:ring-purple-500" oninput="calculate()">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Duration</label>
                            <select id="term" class="w-full border p-3 rounded-xl bg-slate-50 font-semibold" onchange="calculate()">
                                <option value="0">Monthly (Promo)</option>
                                <option value="1">1 Year Contract</option>
                                <option value="2">2 Year Contract</option>
                                <option value="3" selected>3 Year Contract</option>
                                <option value="4">4 Year Contract</option>
                                <option value="5">5 Year Contract</option>
                            </select>
                        </div>
                        <div id="discount_container" class="hidden">
                            <label class="block text-xs font-bold uppercase text-blue-500 mb-1">Yr 2+ Discount %</label>
                            <div class="relative">
                                <input type="number" id="manual_discount" value="0" min="0" max="100" class="w-full border p-3 rounded-xl font-semibold outline-none border-blue-200 bg-blue-50 focus:ring-2 focus:ring-blue-500" oninput="
